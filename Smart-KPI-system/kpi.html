
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KPI Management</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<!-- Navbar -->

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand" href="#">KPI Monitoring System</a>

        <div class="navbar-nav ms-auto">
            <a class="nav-link" href="dashboard.html">Dashboard</a>
            <a class="nav-link active" href="kpi.html">KPI Management</a>
            <a class="nav-link" href="alerts.html">Alerts</a>
        </div>
    </div>
</nav>

<div class="container mt-4">

    <h2 class="text-center mb-4">KPI Management</h2>

    <!-- KPI Form -->

    <div class="card shadow mb-4">
        <div class="card-header bg-primary text-white">
            Add New KPI
        </div>

        <div class="card-body">

            <div class="row">

                <div class="col-md-3">
                    <input type="text"
                           id="kpiName"
                           class="form-control"
                           placeholder="KPI Name">
                </div>

                <div class="col-md-2">
                    <input type="number"
                           id="targetValue"
                           class="form-control"
                           placeholder="Target">
                </div>

                <div class="col-md-2">
                    <input type="number"
                           id="currentValue"
                           class="form-control"
                           placeholder="Current">
                </div>

                <div class="col-md-3">
                    <input type="text"
                           id="department"
                           class="form-control"
                           placeholder="Department">
                </div>

                <div class="col-md-2">
                    <button class="btn btn-success w-100"
                            onclick="addKPI()">
                        Add KPI
                    </button>
                </div>

            </div>

        </div>
    </div>

    <!-- KPI Table -->

    <div class="card shadow">

        <div class="card-header bg-dark text-white">
            KPI Records
        </div>

        <div class="card-body">

            <table class="table table-bordered table-striped">

                <thead>

                <tr>
                    <th>KPI Name</th>
                    <th>Target</th>
                    <th>Current</th>
                    <th>Department</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>

                </thead>

                <tbody id="kpiTable">

                

                </tbody>

            </table>

        </div>

    </div>

</div>

<script>
    let kpis =
    JSON.parse(localStorage.getItem("kpis")) || [];
    function saveKPIs() {

    localStorage.setItem(
        "kpis",
        JSON.stringify(kpis)
    );

}

function addKPI() {

    let name =
        document.getElementById("kpiName").value;

    let target =
        document.getElementById("targetValue").value;

    let current =
        document.getElementById("currentValue").value;

    let department =
        document.getElementById("department").value;
       

    if(name === "" ||
       target === "" ||
       current === "" ||
       department === "") {

        alert("Please fill all fields");

        return;

    }
        let newKPI = {

             name,
             target,
             current,
             department

                };
                
    kpis.push(newKPI);

        saveKPIs();

    let status =
        Number(current) >= Number(target)
        ? '<span class="badge bg-success">On Target</span>'
        : '<span class="badge bg-danger">Below Target</span>';

    loadKPIs();
    saveKPIs();

    document.getElementById("kpiName").value = "";
    document.getElementById("targetValue").value = "";
    document.getElementById("currentValue").value = "";
    document.getElementById("department").value = "";
}

function deleteRow(index){

    kpis.splice(index,1);

    saveKPIs();

    loadKPIs();

}

function loadKPIs() {

    let table =
    document.getElementById("kpiTable");

    table.innerHTML = "";

    kpis.forEach((kpi,index) => {

        let status =
        Number(kpi.current) >= Number(kpi.target)
        ? '<span class="badge bg-success">On Target</span>'
        : '<span class="badge bg-danger">Below Target</span>';

        table.innerHTML += `
        <tr>
            <td>${kpi.name}</td>
            <td>${kpi.target}</td>
            <td>${kpi.current}</td>
            <td>${kpi.department}</td>
            <td>${status}</td>
            <td>
                <button
                class="btn btn-danger btn-sm"
                onclick="deleteRow(${index})">
                Delete
                </button>
            </td>
        </tr>
        `;

    });

}
loadKPIs();
</script>

</body>
</html>
```
