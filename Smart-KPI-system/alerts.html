<script>

const kpis =
JSON.parse(localStorage.getItem("kpis")) || [];

const alertsContainer =
document.getElementById("alertsContainer");

const tableBody =
document.getElementById("alertTableBody");

let totalAlerts = 0;
let criticalAlerts = 0;
let mediumAlerts = 0;

let alertId = 1;

kpis.forEach(kpi => {

    let current = Number(kpi.current);
    let target = Number(kpi.target);

    if(current < target){

        totalAlerts++;

        let percentage =
        (current / target) * 100;

        let severity = "Medium";

        if(percentage < 80){
            severity = "Critical";
            criticalAlerts++;
        }
        else{
            mediumAlerts++;
        }

        alertsContainer.innerHTML += `
        <div class="alert ${
            severity === "Critical"
            ? "alert-danger"
            : "alert-warning"
        }">

            <strong>${severity}:</strong>

            ${kpi.name} is below target.

            Current: ${current}

            Target: ${target}

        </div>
        `;

        tableBody.innerHTML += `
        <tr>
            <td>ALT00${alertId}</td>
            <td>${kpi.name}</td>
            <td>${severity}</td>
            <td>Active</td>
            <td>${new Date().toLocaleDateString()}</td>
        </tr>
        `;

        alertId++;
    }

});

document.getElementById("totalAlerts").innerText =
totalAlerts;

document.getElementById("criticalAlerts").innerText =
criticalAlerts;

document.getElementById("mediumAlerts").innerText =
mediumAlerts;

document.getElementById("resolvedAlerts").innerText =
0;

</script>
